name = "account-matrix"
main = "src/index.js"
compatibility_date = "2026-09-23"
workers_dev = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "account_matrix_db"
database_id = "00000000-0000-0000-0000-000000000000"

[vars]
APP_NAME = "AccountMatrix"
INBOXSTEALTH_ORIGIN = "https://mail.example.com"
DEFAULT_MAIL_DOMAIN = "example.com"
